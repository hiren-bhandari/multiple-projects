<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14171c">
<title>TV Remote</title>
<style>
  /* Layout: one narrow column — status bar, setup panel, then the remote as stacked button clusters. */
  :root {
    --bg: #14171c; --panel: #1e232b; --key: #2a313c; --key-press: #3a4454;
    --fg: #eef1f5; --muted: #9aa5b4; --accent: #4f9dff; --ok: #3ecf8e; --bad: #ff6b6b; --warn: #f5b942;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 20px; margin: 0; flex: 1; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
  #dot.ok { background: var(--ok); } #dot.bad { background: var(--bad); } #dot.wait { background: var(--warn); }
  #status { color: var(--muted); font-size: 14px; }

  details { background: var(--panel); border-radius: 14px; padding: 12px 14px; }
  summary { cursor: pointer; font-weight: 600; }
  .setup { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  label { font-size: 14px; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--key-press); border-radius: 10px; padding: 10px 12px;
  }
  .btn {
    font: inherit; font-weight: 600; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; padding: 10px 16px;
  }
  .setup a { color: var(--accent); }
  #help { font-size: 14px; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
  #help ol { margin: 6px 0 0; padding-left: 20px; }
  .note { font-size: 13px; color: var(--muted); margin: 0; }

  .cluster { display: grid; gap: 10px; }
  .three { grid-template-columns: repeat(3, 1fr); }
  .key {
    font: inherit; font-weight: 600; color: var(--fg); background: var(--key);
    border: 0; border-radius: 14px; min-height: 58px; padding: 6px;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .key:active, .key.down { background: var(--key-press); }
  .key.power { color: var(--bad); }
  .key.okkey { background: var(--accent); color: #fff; }
  .key small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .gap { visibility: hidden; }
</style>
</head>
<body>
<main>
  <header>
    <span id="dot"></span>
    <h1>TV Remote</h1>
    <span id="status">Not connected</span>
  </header>

  <details id="setupBox" open>
    <summary>Connection</summary>
    <div class="setup">
      <label for="ip">TV address (on the TV: Settings &gt; General &gt; Network &gt; Network Status &gt; IP Settings)</label>
      <div class="row">
        <input id="ip" inputmode="decimal" autocomplete="off" placeholder="192.168.1.50">
        <button class="btn" id="connect" type="button">Connect</button>
      </div>
      <div id="help" hidden></div>
      <p class="note">Your phone must be on the same Wi-Fi as the TV, and the TV must be switched on.
        This page talks straight to the TV; nothing is sent anywhere else.</p>
    </div>
  </details>

  <div class="cluster three">
    <button class="key power" data-key="KEY_POWER" type="button">Power</button>
    <button class="key" data-key="KEY_SOURCE" type="button">Source</button>
    <button class="key" data-key="KEY_MUTE" type="button">Mute</button>
  </div>

  <div class="cluster three">
    <button class="key" data-key="KEY_VOLUP" type="button">+<small>Volume</small></button>
    <button class="key" data-key="KEY_UP" type="button" aria-label="Up">&#9650;</button>
    <button class="key" data-key="KEY_CHUP" type="button">&#9650;<small>Channel</small></button>

    <button class="key" data-key="KEY_LEFT" type="button" aria-label="Left">&#9664;</button>
    <button class="key okkey" data-key="KEY_ENTER" type="button">OK</button>
    <button class="key" data-key="KEY_RIGHT" type="button" aria-label="Right">&#9654;</button>

    <button class="key" data-key="KEY_VOLDOWN" type="button">&minus;<small>Volume</small></button>
    <button class="key" data-key="KEY_DOWN" type="button" aria-label="Down">&#9660;</button>
    <button class="key" data-key="KEY_CHDOWN" type="button">&#9660;<small>Channel</small></button>
  </div>

  <div class="cluster three">
    <button class="key" data-key="KEY_RETURN" type="button">Back</button>
    <button class="key" data-key="KEY_HOME" type="button">Home</button>
    <button class="key" data-key="KEY_MENU" type="button">Menu</button>
    <button class="key" data-key="KEY_PLAY" type="button">Play</button>
    <button class="key" data-key="KEY_PAUSE" type="button">Pause</button>
    <button class="key" data-key="KEY_EXIT" type="button">Exit</button>
  </div>
</main>

<script>
(function () {
  var APP_NAME = "Phone Remote";
  var $ = function (id) { return document.getElementById(id); };
  var ipInput = $("ip"), statusEl = $("status"), dot = $("dot"), help = $("help"), setupBox = $("setupBox");
  var socket = null, connected = false, pendingKey = null;

  function load(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
  function save(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

  function setStatus(text, kind) {
    statusEl.textContent = text;
    dot.className = kind || "";
  }

  function showHelp(html) { help.innerHTML = html; help.hidden = !html; if (html) setupBox.open = true; }

  function validIp(ip) {
    var parts = ip.split(".");
    return parts.length === 4 && parts.every(function (p) { return /^\d{1,3}$/.test(p) && +p <= 255; });
  }

  // Secure pages may only open secure sockets, so the plain port is tried
  // only when this page itself was loaded without https.
  function routes() {
    var list = [["wss", 8002]];
    if (location.protocol !== "https:") list.push(["ws", 8001]);
    return list;
  }

  function connect() {
    var ip = ipInput.value.trim();
    if (!validIp(ip)) {
      setStatus("Enter the TV address", "bad");
      showHelp("That doesn't look like an address. It should be four numbers separated by dots, like 192.168.1.50.");
      return;
    }
    save("tv.ip", ip);
    if (socket) { socket.onclose = null; socket.close(); }
    connected = false;
    showHelp("");
    tryRoute(ip, routes(), 0, false);
  }

  function tryRoute(ip, list, index, refused) {
    if (index >= list.length) return failed(ip, refused);
    var scheme = list[index][0], port = list[index][1];
    var url = scheme + "://" + ip + ":" + port + "/api/v2/channels/samsung.remote.control?name=" + btoa(APP_NAME);
    var token = load("tv.token." + ip);
    if (token) url += "&token=" + encodeURIComponent(token);

    setStatus("Connecting…", "wait");
    var ws, opened = false, done = false;
    try { ws = new WebSocket(url); } catch (e) { return tryRoute(ip, list, index + 1, refused); }
    socket = ws;

    var timer = setTimeout(function () { if (!opened) ws.close(); }, 6000);

    ws.onopen = function () {
      opened = true;
      setStatus("Check the TV screen", "wait");
      showHelp("If the TV shows a message asking to allow <b>" + APP_NAME + "</b>, choose <b>Allow</b> with the TV's own remote.");
    };

    ws.onmessage = function (msg) {
      var data;
      try { data = JSON.parse(msg.data); } catch (e) { return; }
      if (data.event === "ms.channel.connect") {
        if (data.data && data.data.token) save("tv.token." + ip, String(data.data.token));
        connected = true;
        setStatus("Connected", "ok");
        showHelp("");
        setupBox.open = false;
        if (pendingKey) { sendKey(pendingKey); pendingKey = null; }
      } else if (data.event === "ms.channel.unauthorized" || data.event === "ms.channel.timeOut") {
        done = true;
        ws.close();
        // A TV that refuses the plain port may still accept the secure one, and vice versa.
        tryRoute(ip, list, index + 1, true);
      }
    };

    ws.onclose = function () {
      clearTimeout(timer);
      if (done || socket !== ws) return;
      if (connected) {
        connected = false;
        setStatus("Disconnected", "bad");
      } else {
        tryRoute(ip, list, index + 1, refused || opened);
      }
    };
  }

  function failed(ip, refused) {
    pendingKey = null;
    if (refused) {
      setStatus("TV refused", "bad");
      showHelp("The TV answered but did not allow this remote.<ol>" +
        "<li>Tap Connect again and watch the TV for an <b>Allow</b> message.</li>" +
        "<li>If none appears, on the TV open Settings &gt; General &gt; External Device Manager &gt; " +
        "Device Connection Manager. Turn Access Notification to <b>First Time Only</b>, and in Device List " +
        "remove or allow <b>" + APP_NAME + "</b>.</li></ol>");
      return;
    }
    setStatus("Can't reach TV", "bad");
    var info = "http://" + ip + ":8001/api/v2/";
    var cert = "https://" + ip + ":8002/api/v2/";
    showHelp("No connection to the TV.<ol>" +
      "<li>Open <a href=\"" + info + "\" target=\"_blank\" rel=\"noopener\">" + info + "</a>. " +
      "If it shows text with the TV's name, the TV is reachable. If it doesn't load, check the address, " +
      "that the TV is on, and that the phone is on the same Wi-Fi.</li>" +
      "<li>Open <a href=\"" + cert + "\" target=\"_blank\" rel=\"noopener\">" + cert + "</a>. " +
      "The browser will warn that the connection is not private, because the TV uses its own certificate. " +
      "Choose Show Details &gt; visit this website, so the browser trusts your TV.</li>" +
      "<li>Come back here and tap Connect.</li></ol>");
  }

  function sendKey(key) {
    if (!connected || !socket || socket.readyState !== 1) {
      pendingKey = key;
      connect();
      return;
    }
    socket.send(JSON.stringify({
      method: "ms.remote.control",
      params: { Cmd: "Click", DataOfCmd: key, Option: "false", TypeOfRemote: "SendRemoteKey" }
    }));
  }

  ipInput.value = load("tv.ip");
  $("connect").addEventListener("click", connect);
  ipInput.addEventListener("keydown", function (e) { if (e.key === "Enter") connect(); });
  document.querySelectorAll("[data-key]").forEach(function (button) {
    button.addEventListener("click", function () { sendKey(button.dataset.key); });
  });
  // Phones drop the socket when the page is in the background; reconnect quietly on return.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && ipInput.value && load("tv.token." + ipInput.value.trim()) &&
        (!socket || socket.readyState > 1)) connect();
  });
})();
</script>
</body>
</html>
